##################################################
# General
##################################################


esphome:
  name: dashboard
  friendly_name: Dashboard

  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
    board_build.flash_mode: dio
    board_upload.maximum_ram_size: 524288

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "9N8zuBhz9K5CsE5N3Fqjz+IF+B1oQjFgcJMefXdYzPI="

ota:
  - platform: esphome
    password: "4020EC1727feea169ac0c9a41ac02407"
    password: "402f081d27feea169ac0c9a41ac02407"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fallback Hotspot"
    password: "JMFCYLFa6I8L"

# Enable captive portal I guess?
captive_portal:


##################################################
# Hardware
##################################################


esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 8MB
  framework:
    type: esp-idf
    # Error: enable_idf_experimental_features is not part of advanced
    # advanced:
    #   enable_idf_experimental_features: true
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: y
      CONFIG_ESPTOOLPY_FLASHFREQ_120M: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_IDF_EXPERIMENTAL_FEATURES: y
      CONFIG_SPIRAM_SPEED_120M: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y

psram:
  mode: octal
  speed: 120MHz

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: True
  id: bus_a

### IO Extender - for backlight, display, etc.
ch422g:
  - id: ch422g_hub

display:
  - platform: rpi_dpi_rgb
    id: my_display
    # Didn't actually show the test card - maybe have to get rid of the other logic?
    # show_test_card: true
    rotation: 180
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
#    enable_pin:
#      ch422g: ch422g_hub
#      number: 2  
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3
        - 2         #r4
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7

touchscreen:
  platform: gt911
  id: my_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_touch:
    - lambda: |-
        ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
  on_update:
    - lambda: |-
          for (auto touch: touches)  {
              if (touch.state <= 2) {
                ESP_LOGI("Touch points:", "id=%d x=%d, y=%d x.raw=%d, y.raw=%d", touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
              }
          }  
  on_release:
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:


##################################################
# UI
##################################################


color:
  - id: color_background
    red_int: 0
    green_int: 0
    blue_int: 0
    white_int: 0

font:
  - file: "https://github.com/IdreesInc/Monocraft/releases/download/v4.1/Monocraft.ttc"
    id: font_mono_medium
    size: 50
  - file: "gfonts://Material+Symbols+Outlined"
    id: font_mdi
    size: 42
    bpp: 4
    glyphs:
      # https://fonts.google.com/icons
      - "\U0000F168" # mode_fan
      - "\U0000EC17" # mode_fan_off
      - "\U0000eb8b" # question_mark

lvgl:
  id: screen
  log_level: none #INFO
  buffer_size: 25%
  disp_bg_color: color_background
  color_depth: 16
  bg_opa: TRANSP

  widgets:
    - button:
        id: fan_button
        align: CENTER
        checkable: true
        widgets:
          - label:
              id: fan_label
              align: center
              text_font: font_mono_medium
              text: "Fan"
        on_click:
          - homeassistant.action:
              action: switch.toggle
              data:
                entity_id: switch.smart_plug_20091197634465251h5748e1e9335290_outlet
    - label:
        id: clock_label
        align: BOTTOM_RIGHT
        text_font: font_mono_medium
        text: "--:--:--"
    - label:
        id: date_label
        align: BOTTOM_LEFT
        text_font: font_mono_medium
        text: "--/--/--"


##################################################
# Logic
##################################################


time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: time_update
      - script.execute: date_update
    on_time:
      - seconds: "*"
        then:
          - script.execute: time_update
      - hours: 0
        minutes: 0
        seconds: 0
        then:
          - script.execute: date_update
      # Turn off the screen at 2 at night. The package makes sure to run the antiburn when the
      # screen is off automatically, but you do need to remember to turn the screen off.
      - seconds: 0
        minutes: 0
        hours: 2
        then:
          - script.execute: display_off
      - seconds: 0
        minutes: 0
        hours: 6
        then:
          - script.execute: display_on

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: clock_label
          text:
            time_format: "%H:%M:%S"
  - id: date_update
    then:
      - lvgl.label.update:
          id: date_label
          text:
            time_format: "%d/%m/%y"
  - id: display_off
    then:
      - switch.turn_off: lcdbacklight
  - id: display_on
    then:
      - switch.turn_on: lcdbacklight
