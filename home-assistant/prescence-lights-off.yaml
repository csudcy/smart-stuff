blueprint:
  name: Presence-activated Light
  description: Turn on a light when presence is detected.
  domain: automation
  input:
    presence_entity:
      name: Presence Sensor
      description: Presence sensor device
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    light_sensor:
      name: Light sensor
      description: Light sensor to read from
      default: []
      selector:
        entity:
          domain:
            - sensor
          device_class:
            - illuminance
          multiple: false
    light_threshold:
      name: Light threshold
      description: Light sensor‘s lower threshold
      default: 200
      selector:
        number:
          min: 0
          max: 255
    light_target:
      name: Light
      description: Light device
      selector:
        target:
          entity:
            domain: light
    bright_percentage:
      name: Bright Percentage
      description: Brightness level that the light will turn into once is turned on
      default: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: percentage

# Switch off
trigger:
  - trigger: state
    entity_id: !input presence_entity
    from: "on"
    to: "off"
  - trigger: numeric_state
    entity_id: !input light_sensor
    above: !input light_threshold

conditions:
  - condition: state
    entity_id: !input light_target
    state: "on"

action:
  - alias: "Turn off the light"
    service: light.turn_off
    target: !input light_target
